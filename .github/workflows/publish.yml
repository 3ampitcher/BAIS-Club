# Keeps the live site in step with main.
#
# Pages publishes from the gh-pages branch — pushing that branch is what gets
# GitHub to provision Pages at all, without anyone changing a repository
# setting. gh-pages is a plain mirror of main, never somewhere to edit. This
# copies main onto it after every push, which triggers GitHub's own pages
# build. Nothing here builds the site: it is static files and they ship
# exactly as committed.
name: Publish main to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main onto gh-pages
        run: git push --force origin HEAD:gh-pages
